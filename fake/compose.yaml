name: clubspot-fake

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: parse
      POSTGRES_PASSWORD: parse
      POSTGRES_DB: parse
    healthcheck:
      # Over TCP, because the image's temporary init server also answers on the socket.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "parse", "-d", "parse"]
      interval: 2s
      timeout: 5s
      retries: 30

  server:
    build: .
    # The restrictions GKE Autopilot puts on the pod, so every integration run proves the image holds under them.
    user: "1000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    environment:
      PARSE_SERVER_DATABASE_URI: postgres://parse:parse@db:5432/parse
    ports:
      # Localhost only: the master key works from any address that reaches the server.
      - "127.0.0.1:${CLUBSPOT_FAKE_PORT:-1337}:1337"
    depends_on:
      db:
        condition: service_healthy
