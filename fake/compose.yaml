name: clubspot-fake

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: parse
      POSTGRES_PASSWORD: parse
      POSTGRES_DB: parse
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "parse", "-d", "parse"]
      interval: 2s
      timeout: 5s
      retries: 30

  server:
    build: .
    environment:
      PARSE_SERVER_DATABASE_URI: postgres://parse:parse@db:5432/parse
    ports:
      - "1337:1337"
    depends_on:
      db:
        condition: service_healthy
