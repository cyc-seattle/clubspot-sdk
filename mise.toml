[settings]
lockfile = true

[tools]
node = "22"
pnpm = "10"
lefthook = "2"

[tasks.install]
description = "Install dependencies and git hooks"
run = ["pnpm install", "lefthook install"]

[tasks.build]
description = "Build the package into dist/"
run = "pnpm run build"

[tasks.format]
description = "Format and fix all files"
run = ["pnpm exec prettier --write .", "pnpm exec eslint --fix ."]

[tasks.check]
description = "Typecheck, then check formatting and lint"
run = ["pnpm exec tsc -p tsconfig.json", "pnpm exec prettier --check .", "pnpm exec eslint ."]

[tasks.test]
description = "Run unit tests"
run = "pnpm exec vitest run"

[tasks.integration]
description = "Run the integration features against the Clubspot fake (needs Docker)"
run = "scripts/integration"

[tasks.ci]
description = "Run all checks and tests"
depends = ["check", "test", "integration"]
